[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "shaagent"
version = "0.1.0"
description = "Scaffold production-grade multi-agent AI systems into any repository"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

[project.scripts]
shaagent = "shaagent.cli:app"

[project.urls]
Homepage = "https://github.com/shaagent/shaagent"
Repository = "https://github.com/shaagent/shaagent"
Issues = "https://github.com/shaagent/shaagent/issues"

[tool.hatch.build.targets.wheel]
packages = ["shaagent"]
artifacts = ["shaagent/bundled/**"]

[tool.hatch.build.targets.sdist]
include = [
    "shaagent/",
    "LICENSE",
]
